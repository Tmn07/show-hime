<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>设置页面</title>
  <link rel="stylesheet" href="buttons-min.css">
  <style>
    .hvr-grow {
      display: inline-block;
      text-align: center;
      padding: 10px;
      height: 110px;
      width: 110px;
    }
    .icon_img {
      background-size: 100% auto;
      height: 100px;
      width: 100px;
      display: inline-block;
      background-repeat: no-repeat;
    }
    .pure-button-primary {
      border-radius: 4px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    }
    .button-success,
    .button-error,
    .button-warning,
    .button-secondary {
      color: white;
      border-radius: 4px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    }
    .button-success   { background: rgb(28, 184, 65); }
    .button-error     { background: rgb(202, 60, 60); }
    .button-warning   { background: rgb(223, 117, 20); }
    .button-secondary { background: rgb(66, 184, 221); }
  </style>
</head>
<body>
  <script src="../js/jquery.min.js"></script>
  <script src="../js/idols.js"></script>

  <h1>选择你要显示的偶像</h1>

  <div class="btns">
    <button id="save_btn" class="pure-button pure-button-primary">保存</button>
    <button id="all_btn"  class="pure-button button-success">全选</button>
    <button id="clr_btn"  class="pure-button button-warning">清空</button>
    <button id="ho_btn"   class="pure-button button-secondary">一键ho叫</button>
  </div>

  <div id="main"></div>

  <div id="footer">
    <p style="text-align: right; font-size: 125%; padding-right: 40px; padding-bottom: 10px;">
      20240202ver. developed by <a href="https://github.com/qq519043202">Tmn07</a>
    </p>
  </div>

  <script src="option.js"></script>
</body>
</html>
